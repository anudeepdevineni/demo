<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="container">
    <h1>Weather</h1>
    <form id="searchForm">
      <input type="text" id="cityInput" placeholder="Enter city" required>
      <button type="submit">Search</button>
    </form>

    <p id="status" class="muted">Type a city and press Search.</p>

    <section id="result" class="card" hidden>
      <h2 id="cityName"></h2>
      <div class="row">
        <img id="icon" width="72" height="72" alt="">
        <div>
          <div id="temp" class="temp"></div>
          <div id="desc" class="muted"></div>
        </div>
      </div>
    </section>

    <section id="forecast" class="card" hidden>
      <h2>Forecast</h2>
      <div id="forecastList" class="days"></div>
    </section>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
